<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Selamat Datang di Demo</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.status{margin:12px 0;padding:12px;border-radius:8px;background:#f4f4f4;font-family:monospace;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Demo Izin Lokasi</h1>
<p>Lokasi diminta otomatis saat halaman terbuka. Izinkan lewat dialog browser.</p>
<div id="status" class="status">Memulai...</div>
<script>
const status = document.getElementById("status");

const setStatus = (text) => { status.textContent = text; };

const save = async (payload) => {
 fetch("/api/location", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify(payload)
 });
};

const finishDenied = async () => {
 await save({status: "denied", ts: new Date().toISOString()});
 setStatus("Lokasi ditolak atau gagal: data denial disimpan. Map tidak ditampilkan.");
};

const start = () => {
 if (!navigator.geolocation) {
  finishDenied().catch(() => setStatus("Geolocation tidak didukung browser ini."));
  return;
 }
 setStatus("Meminta izin geolokasi browser...");
 navigator.geolocation.getCurrentPosition(
  async (position) => {
   const lat = position.coords.latitude;
   const lon = position.coords.longitude;
   const accuracy = position.coords.accuracy;
   await save({
    status: "allowed",
    lat,
    lon,
    accuracy,
    ts: new Date(position.timestamp).toISOString()
   });
   setStatus("Lokasi diterima dan berhasil disimpan. Koordinat tidak ditampilkan.");
  },
  () => { finishDenied().catch(() => setStatus("Lokasi ditolak atau gagal; data denial disimpan.")); },
  {enableHighAccuracy: true, maximumAge: 0, timeout: 10000}
 );
};

window.addEventListener("load", start);
</script>
</body>
</html>
