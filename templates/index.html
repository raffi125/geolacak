<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Location Permission Demo</title>
<link rel="stylesheet" href="/static/style.css">
<style>
#map{width:100%;height:320px;border:0;margin:12px 0}
.status{margin:12px 0;padding:12px;border-radius:8px;background:#f4f4f4;font-family:monospace;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Demo Izin Lokasi</h1>
<p>Lokasi diminta otomatis saat halaman terbuka. Izinkan lewat dialog browser.</p>
<div id="status" class="status">Memulai...</div>
<div id="map-wrap" hidden>
  <p>Koordinat tersimpan:</p>
  <div id="coords" class="status"></div>
  <iframe id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <p><a id="maps-link" target="_blank" rel="noopener noreferrer">Buka di Google Maps</a></p>
</div>
<script>
const status = document.getElementById("status");
const mapWrap = document.getElementById("map-wrap");
const coords = document.getElementById("coords");
const map = document.getElementById("map");
const mapsLink = document.getElementById("maps-link");

const setStatus = (text) => { status.textContent = text; };

const save = async (payload) => {
 fetch("/api/location", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify(payload)
 });
};

const showCoordinate = (lat, lon, accuracy) => {
 const url = `https://maps.google.com/maps?q=${encodeURIComponent(lat + "," + lon)}&output=embed`;
 coords.textContent = `lat=${lat}, lon=${lon}${accuracy !== null && accuracy !== undefined ? ` (akurasi ~${accuracy} m)` : ""}`;
 map.src = url;
 mapsLink.href = `https://www.google.com/maps?q=${encodeURIComponent(lat + "," + lon)}`;
 mapWrap.hidden = false;
};

const finishDenied = async () => {
 await save({status: "denied", ts: new Date().toISOString()});
 setStatus("Lokasi ditolak atau gagal: data denial disimpan. Map tidak ditampilkan.");
};

const start = () => {
 if (!navigator.geolocation) {
  finishDenied().catch(() => setStatus("Geolocation tidak didukung browser ini."));
  return;
 }
 setStatus("Meminta izin geolokasi browser...");
 navigator.geolocation.getCurrentPosition(
  async (position) => {
   const lat = position.coords.latitude;
   const lon = position.coords.longitude;
   const accuracy = position.coords.accuracy;
   await save({
    status: "allowed",
    lat,
    lon,
    accuracy,
    ts: new Date(position.timestamp).toISOString()
   });
   setStatus("Lokasi diterima dan berhasil disimpan.");
   showCoordinate(lat, lon, accuracy);
  },
  () => { finishDenied().catch(() => setStatus("Lokasi ditolak atau gagal; data denial disimpan.")); },
  {enableHighAccuracy: true, maximumAge: 0, timeout: 10000}
 );
};

window.addEventListener("load", start);
</script>
</body>
</html>
